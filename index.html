<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle Carburant RDC</title>
<style>body{font-family:Arial;background:#f4f4f4;margin:0;padding:12px}.card{background:#fff;max-width:480px;margin:auto;padding:16px;border-radius:12px}h2{text-align:center;margin:5px 0 2px;font-size:22px}.sub{text-align:center;color:#666;font-size:13px;margin:0 0 12px}label{font-weight:bold;font-size:13px;display:block;margin-top:12px}input,select{width:100%;padding:11px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font-size:15px;box-sizing:border-box}.row{display:flex;gap:8px}.row button{flex:1;padding:12px;border:2px solid #111;border-radius:8px;background:#fff;font-weight:bold;cursor:pointer}.row button.on{background:#111;color:#facc15}.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;padding:13px;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer}.vert{background:#22c55e}.orange{background:#f59e0b}.pdf{width:100%;padding:12px;margin-top:8px;background:#fff;color:#2563eb;border:2px solid #2563eb;border-radius:8px;font-weight:bold;cursor:pointer}#res{white-space:pre-line;background:#f9f9f9;padding:12px;border-radius:8px;margin-top:12px;font-size:14px;line-height:1.5}.journal{margin-top:14px}.journal div{background:#f9f9f9;padding:9px;border-radius:8px;margin-top:6px;font-size:13px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff;font-weight:bold;cursor:pointer}.small{font-size:12px;color:#666}</style></head>
<body><div class="card">
<h2>CONTROLE CARBURANT - RDC</h2><p class="sub">Camions • Détection de vol • Rapport PDF • Journal</p>
<label>Nom de l'Entreprise / Client</label><input id="entreprise" placeholder="ex: TRANSCO, BRALIMA, SOCIMAT, OK PLAST">
<label>Type de Camion - RDC (Toutes marques)</label>
<select id="camion">
<option value="22">Isuzu FVR - 22L/100 - Distribution Locale</option>
<option value="20">Isuzu FTR - 20L/100 - Moyen Porteur</option>
<option value="16">Isuzu NQR - 16L/100 - Petit Porteur</option>
<option value="28">Mercedes Actros 2640 - 28L/100 - Longue Distance</option>
<option value="24">Mercedes Axor - 24L/100 - Régional</option>
<option value="19">Mercedes Atego - 19L/100 - Distribution</option>
<option value="30">Volvo FH 440 - 30L/100 - Longue Distance</option>
<option value="26">Volvo FM 370 - 26L/100 - Régional</option>
<option value="27">MAN TGS 33.400 - 27L/100 - Chantier / Route</option>
<option value="29">Scania P410 / G410 - 29L/100 - Longue Distance</option>
<option value="32">Howo / Sinotruk 371 - 32L/100 - Carrière / Lourd</option>
<option value="30">Dongfeng 375 - 30L/100 - Benne</option>
<option value="31">FAW J5P - 31L/100 - Benne / Carrière</option>
<option value="23">Hino 500 - 23L/100 - Distribution / Benne</option>
<option value="18">Mitsubishi Canter / Dyna - 18L/100 - Léger</option>
<option value="25">Tata LPT 2518 - 25L/100 - Benne</option>
<option value="24">Iveco Trakker / Eurocargo - 24L/100 - Chantier</option>
<option value="15">Toyota Dyna / Coaster - 15L/100 - Léger</option>
</select>
<div class="small" id="infoBase">Base 22L => 28.6L ville Kin (+30%), 29.7L province (+35%)</div>
<label>Immatriculation</label><input id="plaque" placeholder="Ex: SC-8845">
<label>Type de Trajet - Congo</label><div class="row"><button id="bVille" class="on" onclick="setTrajet('ville')">Ville Kin (+30% bouchon)</button><button id="bProv" onclick="setTrajet('province')">Province (+35% collines)</button></div>
<label>Charge</label><div class="row"><button id="bCharge" class="on" onclick="setCharge('charge')">Chargé</button><button id="bVide" onclick="setCharge('vide')">Vide (retour) -20L</button></div>
<label>Destination</label><input id="destination" placeholder="Ex: Kinshasa-Matadi">
<label>Réservoir au Départ (L)</label><input type="number" id="dep" placeholder="Ex: 200">
<label>Réservoir à l'Arrivée (L)</label><input type="number" id="arr" placeholder="Ex: 80">
<label>Carburant Ajouté en Route (L)</label><input type="number" id="ajout" value="0">
<label>Distance (Km)</label><input type="number" id="km" placeholder="Ex: 320">
<label>Etat Route</label><select id="route"><option>Mixte</option><option>Bon</option><option>Mauvais - Piste</option></select>
<div class="btns"><button class="vert" onclick="calculer()">CALCULER</button><button class="orange" onclick="detecterVol()">DETECTER VOL</button></div>
<button class="pdf" onclick="telechargerPDF()">📄 Rapport PDF</button>
<div id="res">Remplis puis CALCULER.</div>
<div class="journal"><h3>Journal — <span id="nomJournal">Entreprise</span></h3><div id="liste"></div><div class="actions"><button onclick="supprimerDoublons()">🗑 Supprimer les doublons</button><button onclick="viderTout()">🧹 VIDER TOUT</button></div></div>
</div>
<script>
let trajet='ville',charge='charge',dernier=null;
function setTrajet(t){trajet=t;document.getElementById('bVille').className=t=='ville'?'on':'';document.getElementById('bProv').className=t=='province'?'on':''}
function setCharge(c){charge=c;document.getElementById('bCharge').className=c=='charge'?'on':'';document.getElementById('bVide').className=c=='vide'?'on':''}
document.getElementById('camion').onchange=function(){let b=parseFloat(this.value);document.getElementById('infoBase').innerText='Base '+b+'L => '+(b*1.3).toFixed(1)+'L ville Kin (+30%), '+(b*1.35).toFixed(1)+'L province (+35%)'};
function getData(){let base=parseFloat(document.getElementById('camion').value);let conso=trajet=='ville'?base*1.3:base*1.35;let km=parseFloat(document.getElementById('km').value||0);let dep=parseFloat(document.getElementById('dep').value||0);let arr=parseFloat(document.getElementById('arr').value||0);let ajout=parseFloat(document.getElementById('ajout').value||0);let prevu=conso*km/100;if(charge=='vide')prevu=Math.max(0,prevu-20);let reel=(dep+ajout)-arr;let diff=reel-prevu;return{prevu,reel,diff,km};}
function calculer(){let d=getData();let ent=document.getElementById('entreprise').value||'Entreprise';document.getElementById('nomJournal').innerText=ent;let txt='Entreprise: '+ent+'\nCamion: '+document.getElementById('camion').options[document.getElementById('camion').selectedIndex].text+'\nPlaque: '+(document.getElementById('plaque').value||'-')+'\nDestination: '+(document.getElementById('destination').value||'-')+'\nTrajet: '+(trajet=='ville'?'Ville Kin':'Province')+' | Charge: '+charge+' | Route: '+document.getElementById('route').value+'\nDistance: '+d.km+' Km\nPrévu: '+d.prevu.toFixed(1)+' L | Réel: '+d.reel.toFixed(1)+' L | Diff: '+d.diff.toFixed(1)+' L';document.getElementById('res').innerText=txt;dernier={date:new Date().toLocaleString(),plaque:document.getElementById('plaque').value||'-',reel:d.reel,diff:d.diff};ajouterJournal();}
function detecterVol(){calculer();let d=getData();let msg=d.diff>5?'⚠️ VOL SUSPECTÉ - '+d.diff.toFixed(1)+'L en trop - Vérifier chauffeur !':d.diff<-5?'✅ ÉCONOMIE - '+(Math.abs(d.diff)).toFixed(1)+'L économisés':'✅ AUCUN VOL - Consommation normale';document.getElementById('res').innerText+='\n\n'+msg;}
function ajouterJournal(){if(!dernier)return;let j=JSON.parse(localStorage.getItem('journal')||'[]');j.unshift(dernier);localStorage.setItem('journal',JSON.stringify(j));afficher();}
function afficher(){let j=JSON.parse(localStorage.getItem('journal')||'[]');document.getElementById('liste').innerHTML=j.map(x=>'<div>'+x.date+' | Camion '+x.plaque+' | '+x.reel.toFixed(1)+'L | Vol: '+x.diff.toFixed(1)+'L '+(x.diff>5?'⚠️':'✅')+'</div>').join('')||'<div>Aucun enregistrement.</div>';}
function supprimerDoublons(){let j=JSON.parse(localStorage.getItem('journal')||'[]');let vu={};let f=j.filter(x=>{let k=x.date+'-'+x.plaque+'-'+x.reel;if(vu[k])return false;vu[k]=1;return true});localStorage.setItem('journal',JSON.stringify(f));afficher();alert('Doublons supprimés !');}
function viderTout(){if(confirm('Vider tout le journal ?')){localStorage.removeItem('journal');afficher();}}
function telechargerPDF(){let res=document.getElementById('res').innerText;let win=window.open('','','width=600,height=700');win.document.write('<html><head><title>Rapport</title></head><body style="font-family:Arial;padding:20px"><h2>CONTROLE CARBURANT - RDC</h2><p><b>Entreprise:</b> '+(document.getElementById('entreprise').value||'-')+'<br><b>Date:</b> '+new Date().toLocaleDateString()+'</p><hr><p>'+res.replace(/\n/g,'<br>')+'</p><hr><p>Signature chauffeur: ___________<br><br>Signature contrôleur: ___________</p></body></html>');win.document.close();win.print();}
afficher();
</script></body></html>
